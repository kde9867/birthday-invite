html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);overflow-x:hidden}
main{max-width:480px;margin:0 auto;padding-block:40px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.ask{margin:0;font:700 clamp(23px,6.5vw,28px)/1.4 var(--hand);text-wrap:balance}
h1{margin:0;font:400 clamp(36px,10vw,46px)/1.1 var(--display)}
.bar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;font:700 19px/1 var(--hand)}
.bar output{min-width:96px;font-variant-numeric:tabular-nums}
button{font:700 19px/1 var(--hand);color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{position:relative;width:100%;max-width:100%;aspect-ratio:1/1}
#board{position:absolute;inset:0;display:grid;gap:3px;padding:3px;background:var(--ink);border-radius:14px;touch-action:manipulation}
.tile{border:0;padding:0;border-radius:4px;background-image:var(--img);cursor:pointer;transition:transform .12s,filter .12s}
.tile.sel{outline:4px solid var(--gold);outline-offset:-4px;transform:scale(.94)}
.tile.ok{filter:none}
#peek{position:absolute;inset:0;border-radius:14px;background:var(--img) center/cover;border:3px solid var(--ink)}
.hint{margin:0;font:700 19px/1.3 var(--hand);color:var(--soft);min-height:1.3em}
#win{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;border:2.5px solid var(--ink);border-radius:16px;width:100%;box-sizing:border-box}
#win p{margin:0;font:700 24px/1.35 var(--hand)}
#win b{font:400 30px/1.2 var(--display);color:var(--tomato)}
#win a{font:700 21px/1 var(--hand);color:var(--paper);background:var(--tomato);border:2.5px solid var(--ink);border-radius:999px;padding:12px 22px;text-decoration:none}
.solved #board{background:var(--leaf);gap:0}
.solved .tile{border-radius:0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>

<main>
  <p class="ask">Put the birthday girl back together..</p>
  <h1>Birthday Puzzle</h1>
  <div class="bar" role="group" aria-label="Puzzle size">
    <button type="button" id="s3" data-n="3">3×3</button>
    <button type="button" id="s4" data-n="4">4×4</button>
    <button type="button" id="peekbtn" aria-pressed="false">Peek</button>
    <button type="button" id="shuffle">Shuffle</button>
  </div>
  <div class="wrap" id="wrap"><div id="board" aria-label="Puzzle board"></div><div id="peek" hidden></div></div>
  <div class="bar"><output id="moves">0 moves</output></div>
  <p class="hint" id="hint" aria-live="polite">Tap two pieces to swap them</p>
  <section id="win" hidden>
    <p>You did it!</p>
    <b>Friday, Nov 20 · by 7 PM</b>
    <p>Dorm Building 103, 1F</p>
    <a href="./">See the invitation</a>
  </section>
</main>
<script>
(function(){
  var board=document.getElementById('board'),wrap=document.getElementById('wrap'),movesEl=document.getElementById('moves'),hint=document.getElementById('hint'),win=document.getElementById('win'),peek=document.getElementById('peek'),pb=document.getElementById('peekbtn');
  var n=3,order=[],sel=null,moves=0,done=false;
  function shuffle(){
    var a;do{a=[];for(var i=0;i<n*n;i++)a.push(i);for(i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}}while(a.every(function(v,i){return v===i}));
    order=a;moves=0;sel=null;done=false;document.body.classList.remove('solved');win.hidden=true;hint.textContent='Tap two pieces to swap them';draw();
  }
  function draw(){
    board.style.gridTemplateColumns='repeat('+n+',1fr)';board.innerHTML='';
    order.forEach(function(p,i){
      var b=document.createElement('button');b.type='button';b.className='tile'+(i===sel?' sel':'');
      b.style.backgroundSize=(n*100)+'% '+(n*100)+'%';
      b.style.backgroundPosition=(p%n)/(n-1)*100+'% '+Math.floor(p/n)/(n-1)*100+'%';
      b.setAttribute('aria-label','Piece '+(i+1));b.disabled=done;
      b.addEventListener('click',function(){tap(i)});board.appendChild(b);
    });
    movesEl.textContent=moves+(moves===1?' move':' moves');
    document.querySelectorAll('[data-n]').forEach(function(x){x.setAttribute('aria-pressed',+x.dataset.n===n)});
  }
  function tap(i){
    if(done)return;
    if(sel===null){sel=i}else if(sel===i){sel=null}else{var t=order[sel];order[sel]=order[i];order[i]=t;sel=null;moves++}
    draw();
    if(order.every(function(v,i){return v===i})){done=true;draw();document.body.classList.add('solved');hint.textContent='Solved in '+moves+' moves!';win.hidden=false;win.scrollIntoView({behavior:'smooth',block:'nearest'})}
  }
  document.querySelectorAll('[data-n]').forEach(function(x){x.addEventListener('click',function(){n=+x.dataset.n;shuffle()})});
  document.getElementById('shuffle').addEventListener('click',shuffle);
  pb.addEventListener('click',function(){peek.hidden=!peek.hidden;pb.setAttribute('aria-pressed',!peek.hidden)});
  shuffle();
})();
</script>
