<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>Birthday Photo Puzzle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: invitation's white paper strip; pick a polaroid, then a board with a tray of jigsaw pieces underneath. */
:root{--paper:#fff;--ink:#1d1a18;--soft:#716a64;--tomato:#e8372a;--leaf:#62b33f;--star:#f8df52;--gold:#f5b335;--pink:#ffd6ce;--mint:#cfeec0;--dot:#efe9e4;
--hand:"Gaegu","Comic Sans MS",cursive;--display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--body:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;color-scheme:light}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);overflow-x:hidden}
[hidden]{display:none!important}
main{max-width:480px;overflow-x:clip;margin:0 auto;padding-block:36px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.sticker{filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(0 4px 5px rgba(60,30,20,.22));pointer-events:none}
header{position:relative;padding:6px 26px 0}
h1{margin:0;font:400 clamp(38px,11vw,50px)/1.05 var(--display);text-wrap:balance}
h1 span{color:var(--tomato)}
.ask{margin:8px 0 0;font:700 clamp(21px,6vw,25px)/1.35 var(--hand);text-wrap:balance}
.hstar{position:absolute;width:30px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:22px 18px;width:100%;padding:8px 6px}
.pol{position:relative;border:0;background:var(--paper);padding:8px 8px 12px;cursor:pointer;box-shadow:0 6px 16px rgba(60,30,20,.16),0 0 0 1px var(--dot);transition:transform .15s}
.pol:nth-child(1){transform:rotate(-3deg)}.pol:nth-child(2){transform:rotate(2.5deg)}.pol:nth-child(3){transform:rotate(2deg)}.pol:nth-child(4){transform:rotate(-2.5deg)}
.pol:hover,.pol:focus-visible{transform:rotate(0) scale(1.04)}
.pol:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.pol img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.pol b{display:block;padding-top:8px;font:700 19px/1 var(--hand)}
.tape{position:absolute;top:-10px;left:50%;width:56px;height:20px;margin-left:-28px;background:var(--pink);opacity:.85;transform:rotate(-4deg)}
.pol:nth-child(even) .tape{background:var(--mint);transform:rotate(5deg)}
.bar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
button.chip{font:700 19px/1 var(--hand);color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:8px 15px;cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.status{margin:0;font:700 20px/1.2 var(--hand);color:var(--soft);font-variant-numeric:tabular-nums}
#area{position:relative;width:100%;user-select:none;-webkit-user-select:none}
#board{position:absolute;top:0;border-radius:6px;background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:14px 14px;box-shadow:0 0 0 3px var(--ink),0 0 0 9px var(--paper),0 0 0 11px var(--dot)}
#ghost,#full{position:absolute;inset:0;background-size:cover;border-radius:6px}
#ghost{opacity:.13;transition:opacity .2s}
#ghost.on{opacity:.55}
#full{opacity:0;transition:opacity .8s;pointer-events:none}
.won #full{opacity:1}
.won .piece{opacity:0;transition:opacity .8s .3s}
.won #tray{display:none}
.btape{position:absolute;width:74px;height:24px;opacity:.85;pointer-events:none;z-index:900}
#tray{position:absolute;left:0;right:0;border-radius:18px;border:2.5px dashed #d9d1ca}
#tray span{position:absolute;bottom:8px;left:0;right:0;font:700 17px/1 var(--hand);color:#b3aaa2}
.piece{position:absolute;top:0;left:0;touch-action:none;cursor:grab;filter:drop-shadow(0 3px 4px rgba(60,30,20,.3))}
.piece.drag{cursor:grabbing;filter:drop-shadow(0 10px 12px rgba(60,30,20,.35))}
.piece.locked{filter:none;cursor:default;pointer-events:none}
.tom{position:absolute;width:72px;z-index:950;transform:rotate(-12deg)}
.bit{position:absolute;width:12px;height:12px;pointer-events:none;z-index:999;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(320deg);opacity:0}}
#win{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 18px 24px;border:2.5px solid var(--ink);border-radius:18px;width:100%;box-sizing:border-box;position:relative}
#win p{margin:0;font:700 22px/1.35 var(--hand)}
#win .big{font:400 32px/1.1 var(--display);color:var(--tomato)}
#win .when{font:400 25px/1.25 var(--display)}
#win .row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:6px}
#win a{font:700 20px/1 var(--hand);color:#fff;background:var(--tomato);border:2.5px solid var(--ink);border-radius:999px;padding:11px 20px;text-decoration:none}
#win a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.pol,#ghost,#full{transition:none}.bit{display:none}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <path fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".75" d="M146 150c5-14 13-25 25-33"/>
    <path fill="#62b33f" stroke="#1d1a18" stroke-width="4.5" stroke-linejoin="round" d="M214 104l-30-8 21-10-13-24 28 12 21-22 5 31 31-3-24 19 18 22-31-8-8 25z"/>
    <path fill="#3f63d8" stroke="#1d1a18" stroke-width="4.5" stroke-linejoin="round" d="M197 68l28-54 26 50c-17 10-37 11-54 4z"/>
    <path fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" d="M213 40c8 3 15 3 24 0M204 57c13 5 28 5 41 0"/>
    <path fill="none" stroke="#1d1a18" stroke-width="6" stroke-linecap="round" d="M176 170c7-11 18-11 25 0M250 170c7-11 18-11 25 0"/>
    <path fill="#1d1a18" d="M209 188c10 7 22 7 32 0 0 18-8 26-16 26s-16-8-16-26z"/>
    <ellipse cx="166" cy="192" rx="12" ry="7" fill="#ff9d94"/><ellipse cx="284" cy="192" rx="12" ry="7" fill="#ff9d94"/>
  </symbol>
  <symbol id="star" viewBox="0 0 40 40"><path fill="currentColor" stroke="#1d1a18" stroke-width="3.5" stroke-linejoin="round" d="M20 3l5 11 12 1-9 8 3 12-11-7-11 7 3-12-9-8 12-1z"/></symbol>
</svg>

<main>
  <header>
    <svg class="hstar sticker" style="left:-8px;top:-14px;color:#f8df52" aria-hidden="true"><use href="#star"/></svg>
    <svg class="hstar sticker" style="right:-4px;top:-6px;width:24px;color:#62b33f" aria-hidden="true"><use href="#star"/></svg>
    <h1>Birthday <span>Puzzle</span></h1>
    <p class="ask" id="ask">Pick a photo to start!</p>
  </header>

  <section id="pick" class="picks" aria-label="Choose a photo"></section>

  <section id="play" hidden style="width:100%;display:flex;flex-direction:column;align-items:center;gap:16px">
    <div class="bar">
      <button class="chip" type="button" data-n="3">3×3</button>
      <button class="chip" type="button" data-n="4">4×4</button>
      <button class="chip" type="button" id="peek" aria-pressed="false">Peek</button>
      <button class="chip" type="button" id="back">Other photo</button>
    </div>
    <p class="status" id="status">0 / 9 pieces</p>
    <div id="area" aria-label="Puzzle area. Drag the pieces from the tray onto the board.">
      <div id="tray"><span>drag the pieces up ↑</span></div>
      <div id="board"><div id="ghost"></div><div id="full"></div></div>
    </div>
    <section id="win" hidden>
      <p class="big">You did it!</p>
      <p>Now come to our birthday party..</p>
      <p class="when">Friday, Nov 20 · by 7 PM</p>
      <p>Dorm Building 103, 1F</p>
      <div class="row"><a href="./">See the invitation</a><button class="chip" type="button" id="again">Play again</button></div>
    </section>
  </section>
</main>

    function P(t,h){return[x0+dx*t+nx*h*tab*s,y0+dy*t+ny*h*tab*s]}
    var a=P(.37,0),b1=P(.42,.42),b2=P(.24,1.02),b3=P(.5,1.02),c1=P(.76,1.02),c2=P(.58,.42),c3=P(.63,0);
    p.lineTo(a[0],a[1]);p.bezierCurveTo(b1[0],b1[1],b2[0],b2[1],b3[0],b3[1]);p.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],c3[0],c3[1]);p.lineTo(x1,y1);
  }
  function shape(r,c,cell,pad){
    var t=cell*.24,p=new Path2D(),o=pad;
    var top=r?-H[r][c]:0,bot=r<n-1?H[r+1][c]:0,lef=c?-V[r][c]:0,rig=c<n-1?V[r][c+1]:0;
    p.moveTo(o,o);side(p,o,o,o+cell,o,top,t);side(p,o+cell,o,o+cell,o+cell,rig,t);side(p,o+cell,o+cell,o,o+cell,bot,t);side(p,o,o+cell,o,o,lef,t);p.closePath();return p;
  }

  function layout(){
    var W=area.clientWidth,ns=Math.min(W-24,440);
    if(!img.complete||!img.naturalWidth)return;
    if(Math.abs(ns-S)<1&&pieces[0].el)return place();
    S=ns;bx=(W-S)/2;
    area.style.height=(done?S+14:S*(1+GAP+TRAY))+'px';
    board.style.left=bx+'px';board.style.width=board.style.height=S+'px';
    tray.style.top=(S*(1+GAP))+'px';tray.style.height=(S*TRAY)+'px';
    area.querySelectorAll('.piece,.btape,.tom').forEach(function(e){e.remove()});
    var cell=S/n,pad=Math.ceil(cell*.26),dpr=Math.min(window.devicePixelRatio||1,2.5);
    pieces.forEach(function(pc){
      var cv=document.createElement('canvas'),w=cell+pad*2;
      cv.dataset.cell=pc.r*n+pc.c;cv.width=cv.height=Math.round(w*dpr);cv.style.width=cv.style.height=w+'px';cv.className='piece'+(pc.locked?' locked':'');
      var g=cv.getContext('2d');g.scale(dpr,dpr);pc.path=shape(pc.r,pc.c,cell,pad);pc.pad=pad;
      g.save();g.clip(pc.path);g.drawImage(img,pad-pc.c*cell,pad-pc.r*cell,S,S);g.restore();
      g.lineJoin='round';g.lineWidth=3;g.strokeStyle='#fff';g.stroke(pc.path);
      g.lineWidth=1;g.strokeStyle='rgba(29,26,24,.28)';g.stroke(pc.path);
      pc.el=cv;cv.style.zIndex=pc.locked?2:(++z);area.appendChild(cv);
    });
    [[-.03,-.035,-8,'var(--pink)'],[.83,-.03,7,'var(--mint)']].forEach(function(t){
      var d=document.createElement('div');d.className='btape';d.style.left=(bx+t[0]*S)+'px';d.style.top=(t[1]*S)+'px';d.style.transform='rotate('+t[2]+'deg)';d.style.background=t[3];area.appendChild(d);
    });
    var tm=document.createElementNS('http://www.w3.org/2000/svg','svg');tm.setAttribute('class','tom sticker');tm.setAttribute('aria-hidden','true');tm.setAttribute('viewBox','110 6 212 262');
    tm.innerHTML='<use href="#tomato"/>';tm.style.left=(bx-14)+'px';tm.style.top=(S-74)+'px';area.appendChild(tm);
    place();
  }
  function place(){
    pieces.forEach(function(pc){pc.el.style.transform='translate('+(bx+pc.x*S-pc.pad)+'px,'+(pc.y*S-pc.pad)+'px)'});
    var k=pieces.filter(function(p){return p.locked}).length;
    statusEl.textContent=done?'All '+n*n+' pieces placed!':k+' / '+n*n+' pieces';
  }

  function local(e){var r=area.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  area.addEventListener('pointerdown',function(e){
    if(done)return;
    var els=document.elementsFromPoint(e.clientX,e.clientY),pc=null;
    for(var i=0;i<els.length&&!pc;i++){
      if(!els[i].classList||!els[i].classList.contains('piece'))continue;
      var cand=pieces.find(function(p){return p.el===els[i]});
      if(!cand||cand.locked)continue;
      var r=els[i].getBoundingClientRect();
      if(hit.isPointInPath(cand.path,e.clientX-r.left,e.clientY-r.top))pc=cand;
    }
    if(!pc)return;
    e.preventDefault();var p=local(e);
    drag={pc:pc,dx:p.x-(bx+pc.x*S),dy:p.y-pc.y*S,id:e.pointerId};
    pc.el.style.zIndex=++z;pc.el.classList.add('drag');
    try{area.setPointerCapture(e.pointerId)}catch(_){}
  });
  area.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id)return;
    var p=local(e),pc=drag.pc,cs=1/n,W=area.clientWidth,Hh=area.clientHeight;
    pc.x=Math.max(-bx/S,Math.min((W-bx)/S-cs,(p.x-drag.dx-bx)/S));
    pc.y=Math.max(0,Math.min(Hh/S-cs,(p.y-drag.dy)/S));
    pc.el.style.transform='translate('+(bx+pc.x*S-pc.pad)+'px,'+(pc.y*S-pc.pad)+'px)';
  });
  function drop(e){
    if(!drag||e.pointerId!==drag.id)return;
    var pc=drag.pc;drag=null;pc.el.classList.remove('drag');
    var tx=pc.c/n,ty=pc.r/n;
    if(Math.abs(pc.x-tx)<.3/n&&Math.abs(pc.y-ty)<.3/n){
      pc.x=tx;pc.y=ty;pc.locked=true;pc.el.classList.add('locked');pc.el.style.zIndex=2;
      if(pieces.every(function(p){return p.locked}))finish();
    }
    place();
  }
  area.addEventListener('pointerup',drop);area.addEventListener('pointercancel',drop);

  function finish(){
    done=true;document.body.classList.add('won');win.hidden=false;area.style.height=(S+14)+'px';place();
    if(!still){var cols=['#e8372a','#62b33f','#f8df52','#3f63d8','#f5b335','#ffb3c1'];
      for(var i=0;i<40;i++){var s=document.createElement('span');s.className='bit';s.style.background=cols[i%6];s.style.borderRadius=i%2?'50%':'2px';
        s.style.left=(bx+S/2)+'px';s.style.top=(S/2)+'px';s.style.setProperty('--x',(Math.random()*2-1)*S*.7+'px');s.style.setProperty('--y',(Math.random()*2-1.2)*S*.6+'px');
        s.addEventListener('animationend',function(e){e.target.remove()});area.appendChild(s)}}
    setTimeout(function(){win.scrollIntoView({behavior:still?'auto':'smooth',block:'center'})},700);
  }

  document.querySelectorAll('[data-n]').forEach(function(b){b.addEventListener('click',function(){n=+b.dataset.n;start()})});
  $('again').addEventListener('click',start);
  $('peek').addEventListener('click',function(){var on=ghost.classList.toggle('on');this.setAttribute('aria-pressed',on)});
  $('back').addEventListener('click',function(){$('play').hidden=true;$('pick').hidden=false;$('ask').textContent='Pick a photo to start!'});
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(!$('play').hidden)layout()},150)});
})();
</script>
