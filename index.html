<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>토마토 생일파티</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one narrow paper strip read top to bottom, like a phone invitation; the tappable drawing is the only loud thing. */
:root{
  --paper:#fff; --ink:#1d1a18; --soft:#716a64; --tomato:#e8372a; --leaf:#62b33f; --star:#f8df52; --gold:#f5b335; --rule:#ece7e2;
  --hand:"Gaegu","Comic Sans MS",cursive; --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);overflow-x:hidden}
main{max-width:430px;margin:0 auto;padding-block:56px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:36px;text-align:center}
.ask{font:700 clamp(25px,7vw,30px)/1.45 var(--hand);margin:0;text-wrap:balance}
.ask small{display:block;font-size:.86em}
.stage{position:relative;width:100%}
#cake{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;border-radius:20px;-webkit-tap-highlight-color:transparent}
#cake:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
#cake svg{display:block;width:100%;height:auto;overflow:visible}
.hint{margin:6px 0 0;font:700 19px/1.3 var(--hand);color:var(--soft);min-height:1.3em}
.open{fill:none}
.line{stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:4.5}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .55s ease-in-out infinite alternate}
.flame:nth-of-type(2n){animation-delay:-.25s}
@keyframes flick{from{transform:scale(.9,1.05) rotate(-4deg)}to{transform:scale(1.08,.92) rotate(5deg)}}
.happy,.out .sad,.out .flame{display:none}
.out .happy{display:inline}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite alternate}
.out .bob{animation-duration:.5s}
@keyframes bob{from{transform:rotate(-1.2deg)}to{transform:rotate(1.6deg) translateY(-3px)}}
.bit{position:absolute;top:42%;left:30%;width:12px;height:12px;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(320deg);opacity:0}}
h1{font:400 clamp(44px,13vw,56px)/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.dday{display:inline-block;margin-top:12px;font:700 22px/1 var(--hand);color:var(--tomato);font-variant-numeric:tabular-nums}
dl{width:100%;margin:0;display:grid;gap:0;border-top:2.5px solid var(--ink)}
dl div{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:baseline;padding:18px 4px;border-bottom:1.5px solid var(--rule);text-align:left}
dl div:last-child{border-bottom:2.5px solid var(--ink)}
dt{font:700 20px/1.3 var(--hand);color:var(--soft)}
dd{margin:0;font-size:20px;line-height:1.45;min-width:0}
dd b{font:400 26px/1.25 var(--display);display:block}
figure{margin:4px 0 0;width:min(72%,290px);background:var(--paper);padding:10px 10px 12px;border:1px solid var(--rule);box-shadow:0 8px 22px rgba(60,30,20,.13);transform:rotate(-2.5deg)}
figure img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
figcaption{font:700 20px/1.2 var(--hand);padding-top:10px}
.bye{margin:0;font:700 24px/1.4 var(--hand)}
@media (prefers-reduced-motion:reduce){.flame,.bob{animation:none}.bit{display:none}}
</style>
</head>
<body>

      </svg>
    </button>
    <p class="hint" id="hint" aria-live="polite">케이크를 눌러서 촛불을 꺼주세요</p>
  </div>

<script>
(function(){
  var btn=document.getElementById('cake'),hint=document.getElementById('hint'),stage=document.getElementById('stage');
  var colors=['#e8372a','#62b33f','#f8df52','#3f63d8','#f5b335'];
  var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  btn.addEventListener('click',function(){
    var out=btn.classList.toggle('out');
    btn.setAttribute('aria-pressed',out);
    hint.textContent=out?'와줄 거죠? 이제 안 울어요!':'케이크를 눌러서 촛불을 꺼주세요';
    if(!out||still)return;
    for(var i=0;i<26;i++){
      var s=document.createElement('span');s.className='bit';
      s.style.background=colors[i%5];
      s.style.borderRadius=i%2?'50%':'2px';
      s.style.setProperty('--x',(Math.random()*340-120)+'px');
      s.style.setProperty('--y',(Math.random()*-230+40)+'px');
      s.addEventListener('animationend',function(e){e.target.remove()});
      stage.appendChild(s);
    }
  });
  var now=new Date(Date.now()+9*36e5);
  var today=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate());
  var left=Math.round((Date.UTC(2026,10,20)-today)/864e5);
  document.getElementById('dday').textContent=left>0?'D-'+left:left===0?'오늘이에요!':'와줘서 고마웠어요';
})();
</script>
